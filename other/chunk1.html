<!DOCTYPE html>

<title>MINDSPARK — Mobile Mockups</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--green-900:#0D2B1F;--green-800:#1A3829;--green-700:#1E4A35;--green-600:#2D6A4F;--green-500:#40916C;--green-400:#52B788;--green-300:#74C69D;--green-200:#B7E4C7;--green-100:#D8F1E3;--green-50:#EFFAF4;--bg-page:#F8FAFC;--bg-card:#FFFFFF;--bg-subtle:#F1F5F9;--bg-hover:#F1F5F9;--border:#E2E8F0;--slate-200:#E2E8F0;--slate-300:#CBD5E1;--text-subtle:#94A3B8;--slate-400:#94A3B8;--slate-500:#64748B;--text-secondary:#475569;--slate-600:#475569;--slate-700:#334155;--slate-800:#1E293B;--text-primary:#0F172A;--slate-900:#0F172A;--success-bg:#DCFCE7;--success-text:#166534;--warning-bg:#FEF9C3;--warning-text:#854D0E;--error-bg:#FEE2E2;--error-text:#DC2626;--info-bg:#DBEAFE;--info-text:#1E40AF;--live-badge:#EF4444;--live-dot:#EF4444;--crimson:#991B1B;--timer-urgent-border:#F59E0B;--amber-800:#92400E;--amber-50:#FFFBEB;--amber-100:#FEF3C7;--amber-600:#D97706;--shadow-sm:0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);--shadow-lg:0 10px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);--radius-btn:10px;--radius-card:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}
.topnav{position:sticky;top:0;z-index:100;background:#1A3829;height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;}
.topnav span:first-child{font-size:13px;font-weight:700;letter-spacing:0.12em;color:#FFFFFF;}
.topnav span:nth-child(2){opacity:0.55;font-weight:400;color:#FFFFFF;font-size:13px;}
.topnav select{background:rgba(255,255,255,0.12);color:#FFFFFF;border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;margin-left:auto;}
.topnav select option{background:#1A3829;color:#FFFFFF;}
.topnav-count{font-size:12px;opacity:0.6;color:#FFFFFF;}
.container{max-width:900px;margin:0 auto;padding:32px 24px 80px;}
.group-block{margin-bottom:48px;}
.group-header{display:flex;align-items:baseline;gap:12px;margin-bottom:24px;padding-bottom:10px;border-bottom:2px solid #1A3829;}
.group-label{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#1A3829;}
.group-count{font-size:12px;color:#64748B;}
.screen-block{margin-bottom:48px;scroll-margin-top:72px;}
.screen-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;}
.screen-title{font-size:16px;font-weight:600;color:#0F172A;}
.screen-path{font-family:'DM Mono',monospace;font-size:11px;color:#94A3B8;margin-top:4px;}
.top-link{font-size:12px;color:#1A3829;padding:4px 10px;border:1px solid #1A3829;border-radius:6px;text-decoration:none;}
.phone-wrap{display:flex;justify-content:center;padding:8px 0;}
.phone{width:390px;background:#FFFFFF;border-radius:46px;box-shadow:0 0 0 2px #334155,0 0 0 5px #0F172A,0 24px 64px rgba(0,0,0,0.22);overflow:hidden;position:relative;display:flex;flex-direction:column;height:844px;}
.phone-status-bar{height:44px;padding:12px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:inherit;}
.status-time{font-family:'DM Mono',monospace;font-size:15px;font-weight:600;}
.status-icons{display:flex;gap:6px;align-items:center;}
.status-icons svg{width:18px;height:18px;}
.phone-home-bar{height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:absolute;bottom:0;width:100%;z-index:500;}
.home-indicator{width:130px;height:5px;background:#0F172A;border-radius:3px;opacity:0.3;}
.bottom-nav{position:absolute;bottom:0;width:100%;height:60px;background:#FFFFFF;border-top:1px solid #E2E8F0;display:flex;align-items:center;padding:0 8px;gap:0;z-index:50;padding-bottom:12px;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;font-size:10px;font-weight:600;color:#94A3B8;cursor:pointer;}
.bnav-item svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;}
.bnav-item.active{color:#1A3829;}
.bnav-item.active svg{stroke-width:2.4;}
.admin-topbar{height:56px;background:#FFFFFF;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50;flex-shrink:0;}
.admin-topbar-left{display:flex;align-items:center;gap:10px;}
.admin-topbar-logo{width:28px;height:28px;background:#1A3829;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.admin-topbar-logo svg{width:16px;height:16px;color:#FFFFFF;fill:currentColor;}
.admin-topbar-title{font-size:15px;font-weight:700;color:#0F172A;}
.admin-topbar-right{display:flex;align-items:center;gap:12px;}
.icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#475569;cursor:pointer;}
.icon-btn svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor;}
.page-topbar{height:56px;background:#FFFFFF;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50;flex-shrink:0;}
.page-topbar .back-arrow{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#0F172A;cursor:pointer;flex-shrink:0;}
.page-topbar .back-arrow svg{width:22px;height:22px;stroke-width:2.2;fill:none;stroke:currentColor;}
.page-topbar .page-title{font-size:16px;font-weight:700;color:#0F172A;}
.page-topbar .page-action{margin-left:auto;font-size:14px;font-weight:600;color:#1A3829;}
.card{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);}
.btn-primary{width:100%;height:52px;background:#1A3829;color:#FFFFFF;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-secondary{width:100%;height:48px;background:#FFFFFF;color:#1A3829;border:1.5px solid #1A3829;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-destructive{width:100%;height:48px;background:#FEE2E2;color:#DC2626;border:1px solid #FECACA;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
.btn-sm{height:36px;padding:0 14px;background:#1A3829;color:#FFFFFF;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-sm-outline{height:36px;padding:0 14px;background:#FFFFFF;color:#1A3829;border:1.5px solid #1A3829;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.input-group{display:flex;flex-direction:column;gap:6px;}
.input-label{font-size:13px;font-weight:600;color:#0F172A;}
.input-field{height:48px;padding:0 14px;border:1.5px solid #E2E8F0;border-radius:10px;background:#F8FAFC;font-family:'DM Sans',sans-serif;font-size:16px;color:#0F172A;width:100%;box-sizing:border-box;}
.input-field::placeholder{color:#94A3B8;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-live{background:#EF4444;color:#FFFFFF;}
.badge-success{background:#DCFCE7;color:#166534;}
.badge-warning{background:#FEF9C3;color:#854D0E;}
.badge-error{background:#FEE2E2;color:#DC2626;}
.badge-neutral{background:#F1F5F9;color:#475569;}
.badge-exam{background:#DBEAFE;color:#1D4ED8;}
.badge-test{background:#EDE9FE;color:#7C3AED;}
.badge-green{background:#EFFAF4;color:#1A3829;}
.section-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#94A3B8;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.section-header .count{font-size:12px;font-weight:700;color:#475569;letter-spacing:0;text-transform:none;}
.screen-scroll{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#F8FAFC;flex:1;scrollbar-width:none;}
.screen-scroll::-webkit-scrollbar{display:none;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#EF4444;display:inline-block;animation:pulse-live 1.5s ease-in-out infinite;flex-shrink:0;}
@keyframes pulse-live{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(1.15);}}
.drawer-overlay{position:absolute;inset:0;background:rgba(15,23,42,0.5);z-index:200;display:flex;}
.drawer-panel{width:280px;height:100%;background:#FFFFFF;box-shadow:0 10px 32px rgba(0,0,0,0.12);display:flex;flex-direction:column;padding:0;animation:slideInLeft 0.2s ease;}
@keyframes slideInLeft{from{transform:translateX(-100%);}to{transform:translateX(0);}}
.drawer-header{padding:48px 20px 20px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:12px;position:relative;}
.drawer-logo{width:36px;height:36px;background:#1A3829;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.drawer-nav{padding:12px 10px;flex:1;}
.drawer-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:500;color:#475569;margin-bottom:2px;cursor:pointer;}
.drawer-item svg{width:18px;height:18px;stroke-width:1.8;color:#94A3B8;fill:none;stroke:currentColor;}
.drawer-item.active{background:#EFFAF4;color:#1A3829;font-weight:700;}
.drawer-item.active svg{color:#1A3829;stroke-width:2.2;}
.drawer-footer{padding:16px;border-top:1px solid #E2E8F0;}
.drawer-user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#F8FAFC;}
.drawer-avatar{width:32px;height:32px;border-radius:50%;background:#1A3829;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.drawer-logout{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#DC2626;cursor:pointer;margin-top:6px;}
.sheet-overlay{position:absolute;inset:0;background:rgba(15,23,42,0.5);z-index:200;display:flex;align-items:flex-end;}
.sheet-panel{width:100%;background:#FFFFFF;border-radius:18px 18px 0 0;padding:0 0 28px;box-shadow:0 -4px 24px rgba(0,0,0,0.12);animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:4px;background:#E2E8F0;border-radius:2px;margin:12px auto 4px;}
.sheet-title{font-size:16px;font-weight:700;color:#0F172A;padding:12px 20px 16px;border-bottom:1px solid #E2E8F0;}
.sheet-content{padding:20px;display:flex;flex-direction:column;gap:14px;}
.exam-card-live{background:#FFFFFF;border:2px solid #1A3829;border-radius:14px;padding:16px;box-shadow:0 4px 12px rgba(26,56,41,0.12);}
.exam-card-upcoming{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:14px;box-shadow:var(--shadow-sm);}
.exam-card-completed{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:14px;opacity:0.85;}
.kpi-card-dark{background:#1A3829;border-radius:14px;padding:16px;color:#FFFFFF;flex:1;}
.kpi-card-light{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);flex:1;}
.kpi-num{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:4px;}
.kpi-lbl{font-size:12px;font-weight:500;opacity:0.75;}
.kpi-num-dark{color:#FFFFFF;}
.kpi-num-light{color:#0F172A;}
.kpi-lbl-light{color:#475569;opacity:1;}
.consent-item{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:16px;}
.consent-check-row{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;background:#F8FAFC;border-radius:10px;border:1.5px solid #E2E8F0;}
.checkbox-box{width:20px;height:20px;border-radius:6px;background:#1A3829;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.checkbox-box svg{width:12px;height:12px;color:#FFFFFF;stroke-width:3;fill:none;stroke:currentColor;}
.timer-pill{display:inline-flex;align-items:center;gap:8px;background:#EFFAF4;border:1.5px solid #74C69D;border-radius:999px;padding:6px 16px;}
.timer-pill .time{font-family:'DM Mono',monospace;font-size:18px;font-weight:600;color:#1A3829;font-variant-numeric:tabular-nums;}
.timer-pill.urgent{background:#FFFBEB;border-color:#F59E0B;}
.timer-pill.urgent .time{color:#92400E;}
</style>
</head>
